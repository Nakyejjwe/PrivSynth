[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "privsynth"
version = "0.1.0"
description = "Privacy-protected synthetic data generation and evaluation"
authors = [{ name = "Christine Nakyejjwe" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "scikit-learn>=1.3",
                "matplotlib>=3.8", "streamlit>=1.30"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["privsynth*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
